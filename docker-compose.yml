services:
  postgres:
    image: postgres:16-alpine
    container_name: flip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: careerbridge
      POSTGRES_DB: careerbridge
    ports:
      - "5432:5432"
    volumes:
      - flip_postgres_data:/var/lib/postgresql/data

volumes:
  flip_postgres_data:

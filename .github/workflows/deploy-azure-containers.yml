name: Deploy Azure Containers (Web + API)

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "apps/platform-web/**"
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - ".github/workflows/deploy-azure-containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: containers-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed apps
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/platform-web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-azure-containers.yml'
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-azure-containers.yml'

      - name: Resolve deploy targets
        id: targets
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "deploy_web=true" >> "$GITHUB_OUTPUT"
            echo "deploy_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_web=${{ steps.changes.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "deploy_api=${{ steps.changes.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: vars
        run: |
          echo "sha_short=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "env_tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=stg" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Validate required secrets
        env:
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          WEB_IMAGE_NAME: ${{ secrets.WEB_IMAGE_NAME }}
          API_IMAGE_NAME: ${{ secrets.API_IMAGE_NAME }}
          AZURE_WEBAPP_PLATFORM_NAME: ${{ secrets.AZURE_WEBAPP_PLATFORM_NAME }}
          AZURE_WEBAPP_PLATFORM_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PLATFORM_PUBLISH_PROFILE }}
          AZURE_WEBAPP_API_NAME: ${{ secrets.AZURE_WEBAPP_API_NAME }}
          AZURE_WEBAPP_API_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_API_PUBLISH_PROFILE }}
        run: |
          test -n "${REGISTRY_SERVER:-}" || (echo "Missing secret: REGISTRY_SERVER" && exit 1)
          test -n "${REGISTRY_USERNAME:-}" || (echo "Missing secret: REGISTRY_USERNAME" && exit 1)
          test -n "${REGISTRY_PASSWORD:-}" || (echo "Missing secret: REGISTRY_PASSWORD" && exit 1)
          test -n "${WEB_IMAGE_NAME:-}" || (echo "Missing secret: WEB_IMAGE_NAME" && exit 1)
          test -n "${API_IMAGE_NAME:-}" || (echo "Missing secret: API_IMAGE_NAME" && exit 1)
          test -n "${AZURE_WEBAPP_PLATFORM_NAME:-}" || (echo "Missing secret: AZURE_WEBAPP_PLATFORM_NAME" && exit 1)
          test -n "${AZURE_WEBAPP_PLATFORM_PUBLISH_PROFILE:-}" || (echo "Missing secret: AZURE_WEBAPP_PLATFORM_PUBLISH_PROFILE" && exit 1)
          test -n "${AZURE_WEBAPP_API_NAME:-}" || (echo "Missing secret: AZURE_WEBAPP_API_NAME" && exit 1)
          test -n "${AZURE_WEBAPP_API_PUBLISH_PROFILE:-}" || (echo "Missing secret: AZURE_WEBAPP_API_PUBLISH_PROFILE" && exit 1)

      - name: Build and push Web image
        if: steps.targets.outputs.deploy_web == 'true'
        run: |
          WEB_IMAGE=${{ secrets.REGISTRY_SERVER }}/${{ secrets.WEB_IMAGE_NAME }}:${{ steps.vars.outputs.env_tag }}-${{ steps.vars.outputs.sha_short }}
          docker build -f apps/platform-web/Dockerfile -t "$WEB_IMAGE" .
          docker push "$WEB_IMAGE"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"

      - name: Build and push API image
        if: steps.targets.outputs.deploy_api == 'true'
        run: |
          API_IMAGE=${{ secrets.REGISTRY_SERVER }}/${{ secrets.API_IMAGE_NAME }}:${{ steps.vars.outputs.env_tag }}-${{ steps.vars.outputs.sha_short }}
          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker push "$API_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Web container to Azure
        if: steps.targets.outputs.deploy_web == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_PLATFORM_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PLATFORM_PUBLISH_PROFILE }}
          images: ${{ env.WEB_IMAGE }}

      - name: Deploy API container to Azure
        if: steps.targets.outputs.deploy_api == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_API_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_API_PUBLISH_PROFILE }}
          images: ${{ env.API_IMAGE }}

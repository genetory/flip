name: Deploy Azure Containers (Web + API)

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "apps/platform-web/**"
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - ".github/workflows/deploy-azure-containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: containers-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve deploy targets
        id: targets
        run: |
          # 정책:
          # - workflow_dispatch (수동): 항상 둘 다 배포.
          # - main 푸시: 릴리스 머지가 다양한 영역을 모아오고, 직전 배포가
          #   실패/취소된 경우 컨테이너 상태가 git 히스토리와 어긋날 수 있어
          #   path 감지가 누락을 만들 위험이 큼. main 에서는 항상 둘 다 배포.
          # - develop / 그 외: path 감지로 부분 배포(피처 푸시 빈도가 높음).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploy both."
            echo "deploy_web=true" >> "$GITHUB_OUTPUT"
            echo "deploy_api=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "main push — always deploy both (production release safety)."
            echo "deploy_web=true" >> "$GITHUB_OUTPUT"
            echo "deploy_api=true" >> "$GITHUB_OUTPUT"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
            fi
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"

            if [ -z "$CHANGED_FILES" ]; then
              echo "No diff detected (base/head unavailable). Fallback to deploy both."
              echo "deploy_web=true" >> "$GITHUB_OUTPUT"
              echo "deploy_api=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Changed files:"
            echo "$CHANGED_FILES"

            echo "$CHANGED_FILES" | grep -Eq '^apps/platform-web/|^package\.json$|^package-lock\.json$|^docker-compose\.yml$|^\.github/workflows/deploy-azure-containers\.yml$' \
              && echo "deploy_web=true" >> "$GITHUB_OUTPUT" || echo "deploy_web=false" >> "$GITHUB_OUTPUT"
            echo "$CHANGED_FILES" | grep -Eq '^apps/api/|^package\.json$|^package-lock\.json$|^docker-compose\.yml$|^\.github/workflows/deploy-azure-containers\.yml$' \
              && echo "deploy_api=true" >> "$GITHUB_OUTPUT" || echo "deploy_api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: vars
        run: |
          echo "sha_short=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "env_tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=stg" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to container registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_SERVER }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Validate required secrets
        env:
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          WEB_IMAGE_NAME: ${{ secrets.WEB_IMAGE_NAME }}
          API_IMAGE_NAME: ${{ secrets.API_IMAGE_NAME }}
          AZURE_WEBAPP_PLATFORM_NAME: ${{ secrets.AZURE_WEBAPP_PLATFORM_NAME }}
          AZURE_WEBAPP_API_NAME: ${{ secrets.AZURE_WEBAPP_API_NAME }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          test -n "${REGISTRY_SERVER:-}" || (echo "Missing secret: REGISTRY_SERVER" && exit 1)
          test -n "${REGISTRY_USERNAME:-}" || (echo "Missing secret: REGISTRY_USERNAME" && exit 1)
          test -n "${REGISTRY_PASSWORD:-}" || (echo "Missing secret: REGISTRY_PASSWORD" && exit 1)
          test -n "${NEXT_PUBLIC_API_URL:-}" || (echo "Missing secret: NEXT_PUBLIC_API_URL" && exit 1)
          test -n "${AZURE_CREDENTIALS:-}" || (echo "Missing secret: AZURE_CREDENTIALS (service principal JSON)" && exit 1)
          if [ "${{ steps.targets.outputs.deploy_web }}" = "true" ]; then
            test -n "${WEB_IMAGE_NAME:-}" || (echo "Missing secret: WEB_IMAGE_NAME" && exit 1)
            test -n "${AZURE_WEBAPP_PLATFORM_NAME:-}" || (echo "Missing secret: AZURE_WEBAPP_PLATFORM_NAME" && exit 1)
          fi
          if [ "${{ steps.targets.outputs.deploy_api }}" = "true" ]; then
            test -n "${API_IMAGE_NAME:-}" || (echo "Missing secret: API_IMAGE_NAME" && exit 1)
            test -n "${AZURE_WEBAPP_API_NAME:-}" || (echo "Missing secret: AZURE_WEBAPP_API_NAME" && exit 1)
          fi

      - name: Build and push Web image
        if: steps.targets.outputs.deploy_web == 'true'
        run: |
          WEB_IMAGE=${{ secrets.REGISTRY_SERVER }}/${{ secrets.WEB_IMAGE_NAME }}:${{ steps.vars.outputs.env_tag }}-${{ steps.vars.outputs.sha_short }}
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" \
            --build-arg NEXT_PUBLIC_ADSENSE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_LEFT="${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_LEFT }}" \
            --build-arg NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_RIGHT="${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_RIGHT }}" \
            --build-arg NEXT_PUBLIC_ADSENSE_SLOT_INFEED="${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_INFEED }}" \
            --build-arg NEXT_PUBLIC_ADSENSE_LAYOUT_KEY_INFEED="${{ secrets.NEXT_PUBLIC_ADSENSE_LAYOUT_KEY_INFEED }}" \
            -f apps/platform-web/Dockerfile \
            -t "$WEB_IMAGE" .
          docker push "$WEB_IMAGE"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"

      - name: Build and push API image
        if: steps.targets.outputs.deploy_api == 'true'
        run: |
          API_IMAGE=${{ secrets.REGISTRY_SERVER }}/${{ secrets.API_IMAGE_NAME }}:${{ steps.vars.outputs.env_tag }}-${{ steps.vars.outputs.sha_short }}
          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker push "$API_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"

      - name: Azure Login
        if: steps.targets.outputs.deploy_web == 'true' || steps.targets.outputs.deploy_api == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Web container to Azure
        if: steps.targets.outputs.deploy_web == 'true'
        run: |
          az webapp config container set \
            --name "${{ secrets.AZURE_WEBAPP_PLATFORM_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP || 'rg-aply' }}" \
            --container-image-name "${{ env.WEB_IMAGE }}"
          # `config container set` schedules a swap but App Service can lazy-
          # pull for 1–2 min. Force an explicit restart so the new container
          # starts serving by the time this workflow reports success.
          az webapp restart \
            --name "${{ secrets.AZURE_WEBAPP_PLATFORM_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP || 'rg-aply' }}"

      - name: Deploy API container to Azure
        if: steps.targets.outputs.deploy_api == 'true'
        run: |
          az webapp config container set \
            --name "${{ secrets.AZURE_WEBAPP_API_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP || 'rg-aply' }}" \
            --container-image-name "${{ env.API_IMAGE }}"
          # Same eager restart as the web app — see comment above.
          az webapp restart \
            --name "${{ secrets.AZURE_WEBAPP_API_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP || 'rg-aply' }}"

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DEPLOY_DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DEPLOY_DISCORD_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          case "$STATUS" in
            success) EMOJI="✅"; ENV_LABEL=$([ "$REF" = "main" ] && echo "production" || echo "staging") ;;
            failure) EMOJI="❌"; ENV_LABEL=$([ "$REF" = "main" ] && echo "production" || echo "staging") ;;
            cancelled) EMOJI="⚠️"; ENV_LABEL=$([ "$REF" = "main" ] && echo "production" || echo "staging") ;;
            *) EMOJI="ℹ️"; ENV_LABEL="unknown" ;;
          esac
          CONTENT="$EMOJI **$ENV_LABEL** deploy $STATUS — $REF@$SHORT_SHA by $ACTOR\nhttps://github.com/$REPO/actions/runs/$RUN_ID"
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$CONTENT" '{content:$c}')"

  smoke:
    name: Staging smoke tests
    needs: build-and-deploy
    if: needs.build-and-deploy.result == 'success' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SMOKE_BASE_URL: https://staging.aply.global
      SMOKE_API_URL: https://staging-api.aply.global

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for staging warmup
        # Poll until BOTH staging web and api return 200 (handles Azure
        # cold-start which can exceed 30s on either app). Bail after 5 min.
        run: |
          web_ok=0; api_ok=0
          for i in $(seq 1 60); do
            if [ "$web_ok" = "0" ]; then
              w=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://staging.aply.global/ || true)
              [ "$w" = "200" ] && web_ok=1 && echo "Web warm after ${i} attempts."
            fi
            if [ "$api_ok" = "0" ]; then
              a=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://staging-api.aply.global/health || true)
              [ "$a" = "200" ] && api_ok=1 && echo "API warm after ${i} attempts."
            fi
            if [ "$web_ok" = "1" ] && [ "$api_ok" = "1" ]; then
              echo "Both warm."
              exit 0
            fi
            echo "Attempt $i: web=${w:-N/A} api=${a:-N/A}, sleeping 5s..."
            sleep 5
          done
          echo "Staging never warmed up within 5 minutes (web_ok=$web_ok api_ok=$api_ok)." >&2
          exit 1

      - name: Run smoke tests
        run: npx playwright test --config=playwright.config.ts --project=desktop-chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DEPLOY_DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "❌ staging smoke FAILED — https://github.com/$REPO/actions/runs/$RUN_ID" '{content:$c}')"

  promote:
    name: Auto-create PR develop → main
    needs: [build-and-deploy, smoke]
    if: needs.build-and-deploy.result == 'success' && needs.smoke.result == 'success' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "PR develop → main already exists, skipping."
            exit 0
          fi
          # Skip when develop has no commits ahead of main (e.g. right after
          # a manual merge). `gh pr create` would otherwise fail with
          # GraphQL: No commits between main and develop.
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [ "$AHEAD" = "0" ]; then
            echo "develop has no commits ahead of main, nothing to promote."
            exit 0
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BODY="Automated promotion PR. Staging deploy + smoke tests passed.

          - Latest commit: \`$SHORT_SHA\`
          - Deploy run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Staging URL: https://staging.aply.global

          ## QA checklist
          - [ ] Login / signup
          - [ ] Position list + detail
          - [ ] AI matching
          - [ ] Partner / ops dashboard
          - [ ] Mobile responsive
          - [ ] i18n (ko/en/zh-CN/vi/ja/id)"
          gh pr create --base main --head develop \
            --title "Promote develop → main ($SHORT_SHA)" \
            --body "$BODY"

name: Deploy Platform Web to Azure

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "apps/platform-web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-platform-web-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: platform-web-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build platform-web
        run: npm run build -w apps/platform-web

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_PLATFORM_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PLATFORM_PUBLISH_PROFILE }}
          package: .

name: Backfill Position Embeddings

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      mode:
        description: "Backfill mode"
        required: true
        default: missing-only
        type: choice
        options:
          - missing-only
          - all

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pull DB + OpenAI secrets from App Service
        run: |
          APP=${{ secrets.AZURE_WEBAPP_API_NAME }}
          RG=${{ secrets.AZURE_RESOURCE_GROUP || 'rg-aply' }}
          DB_URL=$(az webapp config appsettings list \
            --name "$APP" --resource-group "$RG" \
            --query "[?name=='DATABASE_URL'].value" -o tsv)
          OPENAI=$(az webapp config appsettings list \
            --name "$APP" --resource-group "$RG" \
            --query "[?name=='OPENAI_API_KEY'].value" -o tsv)
          if [ -z "$DB_URL" ]; then echo "DATABASE_URL not found on App Service $APP" && exit 1; fi
          if [ -z "$OPENAI" ]; then echo "OPENAI_API_KEY not found on App Service $APP" && exit 1; fi
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$OPENAI"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "OPENAI_API_KEY=$OPENAI" >> "$GITHUB_ENV"

      - name: Run backfill
        run: |
          if [ "${{ github.event.inputs.mode }}" = "missing-only" ]; then
            npx tsx apps/api/scripts/backfill-position-embeddings.ts --missing-only
          else
            npx tsx apps/api/scripts/backfill-position-embeddings.ts
          fi

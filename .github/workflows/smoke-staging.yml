name: Staging smoke tests

on:
  workflow_run:
    workflows: ["Deploy Azure Containers (Web + API)"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    # Run only when the upstream deploy succeeded (or when triggered manually)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SMOKE_BASE_URL: https://staging.aply.global
      SMOKE_API_URL: https://staging-api.aply.global

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke tests
        run: npx playwright test --config=playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DEPLOY_DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "❌ staging smoke FAILED — https://github.com/$REPO/actions/runs/$RUN_ID" '{content:$c}')"
